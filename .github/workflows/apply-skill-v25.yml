name: Diagnose Skill V2.5 Patch

on:
  push:
    branches:
      - agent/scene-camera-coverage-no-angle-threshold

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose patch payload
        shell: bash
        run: |
          set +e
          out=.repo-sync/diagnostic.txt
          : > "$out"
          echo "chunk files:" >> "$out"
          wc -c .repo-sync/skill-v25/chunk_* >> "$out" 2>&1
          cat .repo-sync/skill-v25/chunk_* > /tmp/skill-v25.patch.gz.b64
          echo "base64 bytes: $(wc -c < /tmp/skill-v25.patch.gz.b64)" >> "$out"
          base64 --decode /tmp/skill-v25.patch.gz.b64 > /tmp/skill-v25.patch.gz 2>> "$out"
          echo "base64 status: $?" >> "$out"
          echo "gzip bytes: $(wc -c < /tmp/skill-v25.patch.gz)" >> "$out"
          sha256sum /tmp/skill-v25.patch.gz >> "$out" 2>&1
          gzip --test /tmp/skill-v25.patch.gz >> "$out" 2>&1
          echo "gzip test status: $?" >> "$out"
          gzip --decompress --stdout /tmp/skill-v25.patch.gz > /tmp/skill-v25.patch 2>> "$out"
          echo "gzip decode status: $?" >> "$out"
          echo "patch bytes: $(wc -c < /tmp/skill-v25.patch)" >> "$out"
          sha256sum /tmp/skill-v25.patch >> "$out" 2>&1
          git apply --check /tmp/skill-v25.patch >> "$out" 2>&1
          echo "git apply check status: $?" >> "$out"
          cat "$out"

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .repo-sync/diagnostic.txt
          git commit -m "Record Skill V2.5 patch diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
