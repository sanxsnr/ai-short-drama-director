name: Apply Skill V2.5 Patch

on:
  push:
    branches:
      - agent/scene-camera-coverage-no-angle-threshold

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-sync/skill-v25/chunk_* > /tmp/skill-v25.patch.gz.b64
          test "$(wc -c < /tmp/skill-v25.patch.gz.b64)" -eq 62553
          base64 --decode --ignore-garbage /tmp/skill-v25.patch.gz.b64 > /tmp/skill-v25.patch.gz
          echo "b0be31b01a183115991b59edab44eeb491dc3dabd3355cecafad189d458becaa  /tmp/skill-v25.patch.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/skill-v25.patch.gz > /tmp/skill-v25.patch
          echo "44cd6690a5ad4327fe1fcdaf43e03dc6ec182ea47f3cbd22a9bbc83ea708eb6f  /tmp/skill-v25.patch" | sha256sum --check
          git apply --check /tmp/skill-v25.patch
          git apply /tmp/skill-v25.patch
          rm -rf .repo-sync
          rm -f .github/workflows/apply-skill-v25.yml

      - name: Validate updated Skill
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -q
          python scripts/validate_rule_sources.py

      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add scene camera coverage and remove fixed angle thresholds"
          git push origin "HEAD:${GITHUB_REF_NAME}"
