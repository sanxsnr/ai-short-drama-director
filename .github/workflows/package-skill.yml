name: Package skill

on:
  push:
    branches:
      - agent/cut-spatial-skill-rules
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill archive
        run: |
          zip -r ai-short-drama-director.zip . \
            -x '.git/*' \
            -x '.github/workflows/package-skill.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: ai-short-drama-director
          path: ai-short-drama-director.zip
