name: Skill tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate unique rule sources
        run: python scripts/validate_rule_sources.py
