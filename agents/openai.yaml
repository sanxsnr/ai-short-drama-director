interface:
  display_name: "AI短剧从0到1导演"
  short_description: "用AI直接成片SEG、空间与CUT规则带新手从灵感做到成片"
  default_prompt: "使用 $ai-short-drama-director 开启零基础模式，从我现有的灵感或素材开始，用固定制作文档一步一步带我完成第一部AI短剧。涉及分镜时先把灵感或小说整理为剧本、对白和视听动作链；建立场景基础空间和摄影点候选库后，先由导演思维设计整场摄影覆盖、机位序列、景别与心理距离曲线，再决定每个SHOT怎么拍、摄影机怎么运和在哪里CUT；随后求解人物与摄影机XYZ关键帧，验证任务与视角适配、审核CUT几何，并检查三镜以上是否重复同一观察位置。不要把固定、运镜或CUT的选择推给用户。每次回复后给出A/B/C三个下一步选择，并让每个可复制选项都以‘使用 $ai-short-drama-director’开头。"
