interface:
  display_name: "AI短剧从0到1导演"
  short_description: "用AI直接成片SEG、空间与CUT规则带新手从灵感做到成片"
  default_prompt: "使用 $ai-short-drama-director 开启零基础模式，从我现有的灵感或素材开始，用固定制作文档一步一步带我完成第一部AI短剧。涉及分镜时先把灵感或小说整理为剧本、对白和视听动作链；建立场景基础空间后，由导演思维主动生成一份统一镜头方案，决定每个SHOT怎么拍、摄影机怎么运和在哪里CUT，再把方案求解为人物与摄影机XYZ关键帧，验证任务证据并审核CUT几何。不要把固定、运镜或CUT的选择推给用户。每次回复后给出A/B/C三个下一步选择，并让每个可复制选项都以‘使用 $ai-short-drama-director’开头。"
