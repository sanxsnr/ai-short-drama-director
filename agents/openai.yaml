interface:
  display_name: "AI短剧从0到1导演"
  short_description: "用CUT优先、空间确认和固定文档带新手从灵感做到成片"
  default_prompt: "使用 $ai-short-drama-director 开启零基础模式，从我现有的灵感或素材开始，用固定制作文档一步一步带我完成第一部AI短剧。涉及分镜时先锁定空间，再按自然切点成立就CUT、先判断30度是否适用，再用角度、同轴大景别、主体／视角变化或组合差异路径拆SHOT并拦截无意近似跳切。每次回复后给出A/B/C三个下一步选择，并让每个可复制选项都以‘使用 $ai-short-drama-director’开头。"
